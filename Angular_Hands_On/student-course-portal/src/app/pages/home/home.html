<h1>{{ portalName }}</h1>

<p>
  Manage your courses, enrollments and academic profile from one place.
</p>

<div>
 <p>Courses Available: {{ availableCourses }}</p>
  <p>Enrolled: 3</p>
  <p>GPA: 3.8</p>
</div>

<hr>

<button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>

<hr>

<input
  type="text"
  [(ngModel)]="searchTerm"
  placeholder="Search courses">

<p>Searching for: {{ searchTerm }}</p>
