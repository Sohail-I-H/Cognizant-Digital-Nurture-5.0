<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">

  <label>Name:</label><br>
  <input type="text" formControlName="studentName">

  <div *ngIf="enrollForm.get('studentName')?.invalid && enrollForm.get('studentName')?.touched">
    Name is required.
  </div>

  <br><br>

  <label>Email:</label><br>
  <input type="email" formControlName="studentEmail">

  <div *ngIf="enrollForm.get('studentEmail')?.invalid && enrollForm.get('studentEmail')?.touched">
    Enter a valid email.
  </div>

  <br><br>

  <label>Course ID:</label><br>
  <input type="text" formControlName="courseId">

  <div *ngIf="enrollForm.get('courseId')?.hasError('required') &&
              enrollForm.get('courseId')?.touched">
    Course ID is required.
  </div>

  <div *ngIf="enrollForm.get('courseId')?.hasError('noCourseCode') &&
              enrollForm.get('courseId')?.touched">
    Course code starting with XX is not allowed.
  </div>

  <br><br>

  <label>Preferred Semester:</label><br>
  <select formControlName="preferredSemester">
    <option value="">Select Semester</option>
    <option value="Odd">Odd</option>
    <option value="Even">Even</option>
  </select>

  <br><br>

  <label>
    <input type="checkbox" formControlName="agreeToTerms">
    I agree to Terms
  </label>

  <br><br>

  <hr>

  <h3>Additional Courses</h3>

  <button type="button" (click)="addCourse()">
    Add Another Course
  </button>

  <br><br>

  <div *ngFor="let ctrl of additionalCourses.controls; let i = index">

    <input [formControl]="ctrl" type="text" placeholder="Additional Course">

    <button type="button" (click)="removeCourse(i)">
      Remove
    </button>

    <br><br>

  </div>

  <button type="submit" [disabled]="enrollForm.invalid">
    Submit
  </button>

</form>
